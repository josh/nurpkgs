name: Update

on:
  schedule:
    - cron: "0 19 * * *" # 11am PST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: nix-x86_64-linux

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: matrix
        name: Generate package matrix
        run: |
          set -o pipefail
          nix eval --raw --impure --file ./internal/update-script-matrix.nix | tee "$GITHUB_OUTPUT"
        env:
          FLAKE_URI: ${{ github.workspace }}

  update:
    name: update-${{ matrix.attr }}
    needs: matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    runs-on: nix-${{ matrix.system }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GT_BOT_TOKEN }}

      - name: Configure git commit author
        run: |
          git config --local user.name 'gitea-actions[bot]'
          git config --local user.email 'gitea-actions@noreply.invalid'

      - name: Run update-script
        run: nix run --file ./internal/update-script.nix </dev/null
        env:
          FLAKE_URI: ${{ github.workspace }}
          UPDATE_NIX_ATTR_PATH: ${{ matrix.attr }}
          GITEA_TOKEN: ${{ secrets.GT_BOT_TOKEN }}
